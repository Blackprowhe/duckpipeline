name: .NET Tests

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DuckPipeline.slnx

      - name: Build
        run: dotnet build DuckPipeline.slnx --no-restore

      - name: Run tests
        run: dotnet test DuckPipeline.slnx --no-build --verbosity normal